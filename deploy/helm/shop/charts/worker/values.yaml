fullnameOverride: worker
replicaCount: 2
image:
  repository: ghcr.io/example/worker
  tag: latest
  pullPolicy: IfNotPresent
service:
  port: 8080
env:
  OTEL_SERVICE_NAME: worker
  OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector.observability.svc.cluster.local:4317
  REDIS_URL: redis://redis:6379/0
autoscaling:
  enabled: false
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
