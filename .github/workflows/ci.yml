name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
          pip install -r apps/catalog/requirements.txt
          pip install -r apps/orders/requirements.txt
          pip install -r apps/worker/requirements.txt
      - name: Ruff
        run: ruff check apps
      - name: Pytest
        working-directory: apps
        run: |
          pytest -q catalog/tests orders/tests worker/tests

  storefront:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/storefront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/storefront/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Helm lint
        run: helm lint deploy/helm/shop

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/terraform
      - name: Terraform validate
        working-directory: infra/terraform/envs/prod
        run: |
          terraform init -backend=false
          terraform validate

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [storefront, catalog, orders, worker]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }} (no push)
        run: docker build -t resilient-commerce/${{ matrix.service }}:ci apps/${{ matrix.service }}
