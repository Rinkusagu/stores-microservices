services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalog:
    build: ./apps/catalog
    ports:
      - "${CATALOG_HOST_PORT:-8081}:8080"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  orders:
    build: ./apps/orders
    ports:
      - "${ORDERS_HOST_PORT:-8082}:8080"
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: ./apps/worker
    ports:
      - "${WORKER_HOST_PORT:-8083}:8080"
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PORT: "8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz')",
        ]
      interval: 5s
      timeout: 3s
      retries: 15

  storefront:
    build: ./apps/storefront
    ports:
      - "${STOREFRONT_HOST_PORT:-8080}:8080"
    environment:
      CATALOG_URL: ${CATALOG_URL:-http://catalog:8080}
      ORDERS_URL: ${ORDERS_URL:-http://orders:8080}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: storefront
    depends_on:
      catalog:
        condition: service_healthy
      orders:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

